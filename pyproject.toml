[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe33"
version = "33.0.0"
description = "DrivenData DOE GEMS fault-detection campaign, session 33 — standing-prompt working repo"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "rasterio==1.4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
