name: Tests and site build

on:
  push:
    branches:
      - main
      - arena/01a104ca-gemsdoe33
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit and site-copy tests
        run: python -m pytest -q
      - name: Regenerate static site
        run: python scripts/build_site.py
      - name: Check whitespace errors
        run: git diff --check
