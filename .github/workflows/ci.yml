name: Tests and site build

on:
  push:
    branches:
      - main
      - arena/01a104ca-gemsdoe33
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the scientific stack and tests
        run: python -m pip install -e '.[dev]'
      - name: Run deterministic tests, site build, and static checks
        run: bash scripts/run_checks.sh
